<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Food</title>
<meta name="description" content="Enter a wallet and see how much $FP and ETH it spent on the Fren Pet game on Base: per action, how much was burned, and what that is in dollars right now.">
<meta property="og:title" content="Pet Food">
<meta property="og:description" content="How much $FP a wallet spent on the Fren Pet game on Base, what it went to, and how much was burned.">
<meta name="theme-color" content="#DBFEE6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Fren Pet brand guideline: mint #DBFEE6, charcoal #342E2E, white; Inter Medium and Bold. Layout after fees.wtf: a few big sentences. */
:root { --mint: #DBFEE6; --ink: #342E2E; --paper: #FFFFFF; --sage: #A8C0B0; --dim: #55655B; }
* { box-sizing: border-box; }
html { background: var(--mint); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; line-height: 1.35; }
a { color: inherit; text-underline-offset: 3px; }
.top { display: flex; align-items: center; gap: 10px; padding: 18px 22px; }
.top svg { width: 30px; height: auto; display: block; }
.word { font-size: 21px; letter-spacing: -.02em; font-weight: 400; }
.word b { font-weight: 700; }
.top .what { margin-left: auto; }
main { max-width: 1040px; margin: 0 auto; padding: 8px 22px 70px; text-align: center; }
.pet { height: 96px; margin: 18px auto 14px; display: flex; justify-content: center; align-items: flex-end; }
.pet svg { height: 96px; width: auto; }
form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0 auto 10px; max-width: 640px; }
input { flex: 1 1 320px; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0; box-shadow: 4px 4px 0 var(--ink); outline: none; }
input::placeholder { color: #8a968f; }
input:focus-visible { box-shadow: 4px 4px 0 var(--ink), 0 0 0 3px var(--sage); }
button { font: inherit; font-weight: 700; font-size: 16px; padding: 12px 20px; color: var(--mint); background: var(--ink); border: 2px solid var(--ink); border-radius: 0; box-shadow: 4px 4px 0 var(--sage); cursor: pointer; }
button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--sage); }
button:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
.who { margin: 0; min-height: 1.4em; font-size: 15px; color: var(--dim); overflow-wrap: anywhere; }
.who.bad { color: var(--ink); font-weight: 700; }
.say { margin: 34px auto 0; max-width: 21em; font-size: clamp(26px, 4.6vw, 44px); letter-spacing: -.02em; line-height: 1.22; text-wrap: balance; }
.say + .say { margin-top: 26px; }
.say b, .n { font-weight: 700; white-space: nowrap; }
.say.small { font-size: clamp(19px, 2.9vw, 27px); max-width: 30em; color: var(--ink); }
.wait { opacity: .35; }
table { width: 100%; max-width: 860px; margin: 44px auto 0; border-collapse: collapse; text-align: right; font-size: 17px; font-variant-numeric: tabular-nums; }
caption { caption-side: top; text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding-bottom: 8px; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 500; padding: 0 0 8px 14px; }
td { padding: 11px 0 11px 14px; border-top: 2px solid var(--ink); vertical-align: baseline; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td:first-child { font-weight: 700; }
td small { display: block; font-size: 13px; font-weight: 500; color: var(--dim); }
tr.sum td { border-top-width: 4px; font-weight: 700; }
tr.off td { color: var(--dim); border-top: 2px dashed var(--sage); }
tr.off td:first-child { font-weight: 500; }
.note { max-width: 860px; margin: 14px auto 0; text-align: left; font-size: 14px; color: var(--dim); }
.all { margin-top: 56px; padding-top: 26px; border-top: 2px dashed var(--sage); }
.foot { max-width: 860px; margin: 40px auto 0; text-align: left; font-size: 13px; color: var(--dim); }
.foot p { margin: 0 0 8px; }
[hidden] { display: none !important; }
.hello { margin: 26px auto 30px; max-width: 18em; font-size: clamp(28px, 5vw, 50px); letter-spacing: -.02em; line-height: 1.18; text-wrap: balance; }
.hello b { font-weight: 700; }
@media (max-width: 640px) {
  table, tbody, tr, td { display: block; }
  caption { display: block; width: 100%; }
  thead, .d { display: none; }
  tr { border-top: 2px solid var(--ink); padding: 10px 0; text-align: left; }
  tr.sum { border-top-width: 4px; }
  tr.off { border-top: 2px dashed var(--sage); }
  td { border: 0 !important; padding: 0; text-align: left; }
  td[data-k]::before { content: attr(data-k) " "; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 500; }
  td:empty { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .wait { animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: .15; } } }
</style>
</head>
<body>
<header class="top">
  <a href="./" aria-label="Start" id="logo"></a>
  <span class="word"><b>fren</b>pet</span>
  <span class="word what">pet<b>food</b></span>
</header>
<main>
  <div class="pet" id="pet" aria-hidden="true"></div>
  <p class="hello" id="hello" hidden>How much did YOU spend to keep your virtual onchain pets alive?</p>
  <form id="form" autocomplete="off">
    <input id="addr" name="wallet" inputmode="latin" spellcheck="false" autocapitalize="off" placeholder="0x… a wallet address" aria-label="Wallet address">
    <button type="submit">Show</button>
  </form>
  <p class="who" id="who" role="status"></p>

  <p class="say" id="s1"><span id="subj">This wallet</span> spent <b id="spent" class="wait">…</b> on Fren Pet. Right now, that's <b id="usd" class="wait">…</b>.</p>
  <p class="say" id="s2"><b id="burned" class="wait">…</b> <span id="burnedTail">of it was burned for good.</span></p>
  <p class="say small" id="s3" hidden></p>

  <table id="rows" hidden>
    <caption>What the tokens went to</caption>
    <thead><tr><th>Action</th><th>Times</th><th>Spent</th><th>Today</th><th>$FP burned</th></tr></thead>
    <tbody></tbody>
  </table>
  <p class="note" id="note" hidden></p>

  <section class="all" id="all" hidden>
    <p class="say small" id="a1"></p>
  </section>

  <div class="foot" id="foot"></div>
</main>
